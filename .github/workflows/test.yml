name: Test Packages
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "mocha --grep pattern to narrow the instrumentation-knex test run"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NPM_CONFIG_UNSAFE_PERM: true
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Use the same Node.js version used for `release-please` workflow.
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      # Sealed build: the fork is based on the instrumentation-knex-v0.60.0 tag and the
      # version patch bumps the package to 0.63.0 (@opentelemetry/instrumentation ^0.219.0).
      # Lock files cannot travel in the version patch, so re-sync package-lock.json with the
      # bumped package.json, resolving at the 0.63.0 release date.
      - name: Sync lockfile with version patch
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://:2026-06-11T14%3A54%3A41.852000Z@time-machines-npm.sealsecurity.io/
        timeout-minutes: 10
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10
      # Note: when pushing to main we want to test only what changed in
      # last commit. Otherwise we want to test all changes from origin/main.
      # So we set the right values for base and head commits depending
      # on the type of event (PR or push)
      # ref: https://nx.dev/ci/features/affected#configure-affected-on-ci
      - name: Set base and head commits
        run: |
          if [ "${{github.event_name}}" == "push" ]; then
            echo "NX_BASE=origin/main~1" >> "$GITHUB_ENV"
            echo "NX_HEAD=origin/main" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=origin/main" >> "$GITHUB_ENV"
            echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          fi
      - name: Compile (Delta)
        run: npx nx run-many -t compile -p @opentelemetry/instrumentation-knex
      - name: Pack
        run: |
          mkdir -p /tmp/pack
          npm pack --workspace=packages/instrumentation-knex --pack-destination=/tmp/pack
          mv /tmp/pack/opentelemetry-instrumentation-knex-0.63.0.tgz /tmp/pack/instrumentation-knex-0.63.0.tgz
      - name: Upload Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: /tmp/pack/instrumentation-knex-0.63.0.tgz
          if-no-files-found: error
          retention-days: 7

  unit-test:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # Sealed build: the fork is based on the instrumentation-knex-v0.60.0 tag and the
      # version patch bumps the package to 0.63.0 (@opentelemetry/instrumentation ^0.219.0).
      # Lock files cannot travel in the version patch, so re-sync package-lock.json with the
      # bumped package.json, resolving at the 0.63.0 release date.
      - name: Sync lockfile with version patch
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://:2026-06-11T14%3A54%3A41.852000Z@time-machines-npm.sealsecurity.io/
        timeout-minutes: 10
      - name: Install
        run: npm ci
        timeout-minutes: 10
      # Note: see comment in the compile job
      - name: Set base and head commits
        run: |
          if [ "${{github.event_name}}" == "push" ]; then
            echo "NX_BASE=origin/main~1" >> "$GITHUB_ENV"
            echo "NX_HEAD=origin/main" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=origin/main" >> "$GITHUB_ENV"
            echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          fi
      - name: Compile (Delta)
        run: npx nx run-many -t compile -p @opentelemetry/instrumentation-knex
      - name: Unit tests (Nodejs - Delta)
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npx cross-env NODE_OPTIONS='-r dotenv/config' DOTENV_CONFIG_PATH=./test/test-services.env nx run-many -t test -p @opentelemetry/instrumentation-knex --outputStyle=stream -- --grep "$TEST_FILTER"
          else
            npx cross-env NODE_OPTIONS='-r dotenv/config' DOTENV_CONFIG_PATH=./test/test-services.env nx run-many -t test -p @opentelemetry/instrumentation-knex --outputStyle=stream
          fi

  test-all-versions:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node:
          - "18"
          - "20"
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # Sealed build: the fork is based on the instrumentation-knex-v0.60.0 tag and the
      # version patch bumps the package to 0.63.0 (@opentelemetry/instrumentation ^0.219.0).
      # Lock files cannot travel in the version patch, so re-sync package-lock.json with the
      # bumped package.json, resolving at the 0.63.0 release date.
      - name: Sync lockfile with version patch
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_REGISTRY: https://:2026-06-11T14%3A54%3A41.852000Z@time-machines-npm.sealsecurity.io/
        timeout-minutes: 10
      - run: npm ci
        timeout-minutes: 10
      # Note: see comment in the compile job
      - name: Set base and head commits
        run: |
          if [ "${{github.event_name}}" == "push" ]; then
            echo "NX_BASE=origin/main~1" >> "$GITHUB_ENV"
            echo "NX_HEAD=origin/main" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=origin/main" >> "$GITHUB_ENV"
            echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          fi
      - name: Compile (Delta)
        run: npx nx run-many -t compile -p @opentelemetry/instrumentation-knex
      - name: Test All Versions (Delta)
        run: npx cross-env NODE_OPTIONS='-r dotenv/config' DOTENV_CONFIG_PATH=./test/test-services.env npm run --if-present test-all-versions -w packages/instrumentation-knex

  coverage-report:
    if: false
    needs: test-all-versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10
      # Note: Keep this in sync with the node versions from `test-all-versions` job.
      - name: Download Test Artifacts (18)
        uses: actions/download-artifact@v8
        with:
          name: tests-coverage-cache-${{ github.run_number }}-18
          path: .
      - name: Download Test Artifacts (20)
        uses: actions/download-artifact@v8
        with:
          name: tests-coverage-cache-${{ github.run_number }}-20
          path: .
      - name: Download Test Artifacts (22)
        uses: actions/download-artifact@v8
        with:
          name: tests-coverage-cache-${{ github.run_number }}-22
          path: .
      - name: Download Test Artifacts (24)
        uses: actions/download-artifact@v8
        with:
          name: tests-coverage-cache-${{ github.run_number }}-24
          path: .
      - name: Report Coverage with Flags
        run: node ./scripts/codecov-upload-flags.mjs
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH_NAME: ${{ github.event.pull_request.head.label }}
